<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Eco Pulse - Registro</title>
  <link rel="stylesheet" href="public/assets/styles/register.css" />
</head>
<body>
  <div class="register-container">
    <div class="logo-section">
      <a href="index.html">
        <img src="public/assets/images/logo-ecopulse.png" alt="Eco Pulse Logo" class="logo" />
      </a>
      <h1>Eco Pulse</h1>
    </div>
    <div class="form-section">
      <h2>Registrarse</h2>
      <form id="registerForm">
        <label for="name">Nombre completo</label>
        <input type="text" id="name" required />

        <label for="email">Correo electrónico</label>
        <input type="email" id="email" required />

        <label for="password">Contraseña</label>
        <input type="password" id="password" required />

        <label for="confirmPassword">Confirmar contraseña</label>
        <input type="password" id="confirmPassword" required />

        <button type="submit" class="register-btn">Crear cuenta</button>
        <p class="login-link">
          ¿Ya tienes cuenta? <a href="login.html">Inicia sesión aquí</a>
        </p>
      </form>
    </div>
  </div>

  <script>
    document.getElementById('registerForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const name = document.getElementById('name').value.trim();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value.trim();
      const confirmPassword = document.getElementById('confirmPassword').value.trim();

      if (password !== confirmPassword) {
        alert("Las contraseñas no coinciden");
        return;
      }

      if (name && email && password) {
        alert("Registro exitoso");

        window.location.href = "login.html";
      } else {
        alert("Por favor, completa todos los campos.");
      }
    });
  </script>
</body>
</html>
